name: ONIX scan timing diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'fbs_diagnostics.py'
      - 'app.py'
      - 'wms.py'
      - 'tests/test_fbs_diagnostics.py'
      - '.github/workflows/onix-fbs-diagnostics-tests.yml'
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q fbs_diagnostics.py app.py wms.py
      - name: Test diagnostics
        run: python -m unittest discover -s tests -p 'test_fbs_diagnostics.py' -v
