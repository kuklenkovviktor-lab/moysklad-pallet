name: WB PDF batch pilot tests
on:
  push:
    branches:
      - feature/wb-pdf-batches-pilot-20261028
  pull_request:
    paths:
      - 'wb_pdf_batches.py'
      - 'tests/test_wb_pdf_batches.py'
      - '.github/workflows/wb-pdf-batch-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.0
      - run: python -m unittest discover -s tests -p test_wb_pdf_batches.py -v
