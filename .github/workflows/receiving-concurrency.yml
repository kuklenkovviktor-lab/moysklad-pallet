name: Receiving document serialization
on:
  pull_request:
    paths: ['app.py', 'receiving_lock.py', 'tests/test_receiving_concurrency.py', 'deploy/verify_receiving_postgres.py', '.github/workflows/receiving-concurrency.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serialization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t grit-wms:receiving-test .
      - run: python3 deploy/verify_receiving_postgres.py
