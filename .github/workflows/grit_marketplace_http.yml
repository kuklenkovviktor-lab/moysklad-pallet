name: GRIT Marketplace HTTP adapter tests
on:
  pull_request:
    paths:
      - 'marketplace_http.py'
      - 'marketplace_http_journal.py'
      - 'marketplace_lab.py'
      - 'integrations.py'
      - 'app.py'
      - 'test_marketplace_http.py'
      - '.github/workflows/grit_marketplace_http.yml'
  push:
    branches: [main]
    paths:
      - 'marketplace_http.py'
      - 'marketplace_http_journal.py'
      - 'marketplace_lab.py'
      - 'integrations.py'
      - 'test_marketplace_http.py'
      - '.github/workflows/grit_marketplace_http.yml'
jobs:
  offline-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Syntax check
        run: python -m py_compile marketplace_http.py marketplace_http_journal.py integrations.py marketplace_lab.py app.py
      - name: Mock transport, auth, retries, rate-limit, journal isolation
        run: python -m unittest -v test_marketplace_http
