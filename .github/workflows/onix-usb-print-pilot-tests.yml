name: ONIX isolated USB print pilot tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'onix_usb_print_test.py'
      - 'tests/test_onix_usb_print_test.py'
      - 'docs/ONIX_USB_PRINT_PILOT.md'
      - '.github/workflows/onix-usb-print-pilot-tests.yml'
  workflow_dispatch:
jobs:
  print-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q onix_usb_print_test.py tests/test_onix_usb_print_test.py
      - run: python -m unittest discover -s tests -p 'test_onix_usb_print_test.py' -v
