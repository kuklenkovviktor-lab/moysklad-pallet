name: HOSTKEY deployment configuration
on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'compose.yaml', 'deploy/**', 'tests/deployment/**', 'requirements.txt', '.github/workflows/hostkey-deployment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests/deployment -v
      - run: docker build -t grit-wms:hostkey .
      - run: docker build -f deploy/backup.Dockerfile -t grit-wms-backup:hostkey .
      - run: docker pull postgres:17-bookworm
      - run: python deploy/verify_stack.py
