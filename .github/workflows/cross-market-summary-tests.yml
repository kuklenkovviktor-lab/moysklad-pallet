name: ONIX cross-market employee summary
on:
  push:
    branches:
      - feature/employee-cross-market-stats-20261028
  pull_request:
    paths:
      - wms.py
      - tests/test_cross_market_shift_summary.py
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile wms.py
      - run: python -m unittest discover -s tests -p 'test_cross_market_shift_summary.py' -v
