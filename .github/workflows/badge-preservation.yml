name: Preserve issued employee badges
on:
  pull_request:
    paths:
      - 'wms.py'
      - 'tests/test_badge_preservation.py'
      - '.github/workflows/badge-preservation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  badge-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: badge_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U badge_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: SQLite regression
        run: python -m unittest discover -s tests -p test_badge_preservation.py -v
      - name: PostgreSQL 17 regression
        env:
          GRIT_BADGE_TEST_ADMIN_DSN: postgresql://badge_ci:synthetic-ci-only@127.0.0.1:5432/postgres
        run: python -m unittest discover -s tests -p test_badge_preservation.py -v
