name: HOSTKEY production release (manual, guarded)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grit-hostkey-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Receiving regression (synthetic token only)
        env:
          MOYSKLAD_TOKEN: synthetic-test-token
        run: python -m unittest discover -s tests -p 'test_receiving*.py' -v
      - name: Build container
        run: docker build -t grit-wms:release-${{ github.sha }} .

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH credentials with pinned host key
        env:
          HOST: ${{ secrets.HOSTKEY_HOST }}
          USER: ${{ secrets.HOSTKEY_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTKEY_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.HOSTKEY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$SSH_KEY" && test -n "$HOST_KEYS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf 'HOST=%s\nUSER=%s\n' "$HOST" "$USER" >> "$GITHUB_ENV"
      - name: Build production image
        run: docker build -t grit-wms:release-${{ github.sha }} .
      - name: Upload image and release files
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$USER@$HOST" 'mkdir -p /opt/grit-data/deployment'
          docker save grit-wms:release-${{ github.sha }} | ssh -o StrictHostKeyChecking=yes "$USER@$HOST" docker load
          scp -o StrictHostKeyChecking=yes compose.yaml "$USER@$HOST:/opt/grit-wms/compose.next.yaml"
          scp -o StrictHostKeyChecking=yes deploy/hostkey_release.sh "$USER@$HOST:/opt/grit-data/deployment/hostkey_release.sh"
      - name: Deploy and verify (rollback on failure)
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "bash /opt/grit-data/deployment/hostkey_release.sh ${{ github.sha }}"
