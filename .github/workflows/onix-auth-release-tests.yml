name: ONIX 1.0 auth and session safety
on:
  pull_request:
    paths:
      - app.py
      - wms.py
      - tests/test_onix_auth_badge_security.py
  push:
    branches:
      - fix/onix-v1-auth-badge-manager-route-20261029
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py wms.py
      - run: python -m unittest discover -s tests -p 'test_onix_auth_badge_security.py' -v
