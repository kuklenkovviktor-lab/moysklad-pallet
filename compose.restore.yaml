# Existing db container and test database grit are never changed/recreated.
services:
  app:
    environment:
      GRIT_DATABASE_NAME: ${GRIT_DATABASE_NAME:?Run prepare-live first}
      WB_SYNC_DAYS: ${WB_SYNC_DAYS:-5}
      WB_STRICT_MATCHING: ${WB_STRICT_MATCHING:-0}
      FBS_RATE: ${FBS_RATE:-2.25}
      FBS_TARGET: ${FBS_TARGET:-1600}
      SUPERVISOR_TERMINAL_VERSION: ${SUPERVISOR_TERMINAL_VERSION:-1}
      SUPERVISOR_QR_PERIOD: ${SUPERVISOR_QR_PERIOD:-30}
      MANAGER_LOGIN_MAX_ATTEMPTS: ${MANAGER_LOGIN_MAX_ATTEMPTS:-8}
      MANAGER_LOGIN_WINDOW_SECONDS: ${MANAGER_LOGIN_WINDOW_SECONDS:-600}
      MANAGER_LOGIN_BLOCK_SECONDS: ${MANAGER_LOGIN_BLOCK_SECONDS:-900}
      BOOTSTRAP_CACHE_SECONDS: ${BOOTSTRAP_CACHE_SECONDS:-300}
  backup:
    environment:
      PGDATABASE: ${GRIT_DATABASE_NAME:?Run prepare-live first}
