name: grit-wms-test
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: grit
      POSTGRES_DB: grit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 deploy/init_env.py first}
    volumes:
      - ${GRIT_DATA_ROOT:-/opt/grit-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U grit -d grit']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [database]
    logging: *logging
    shm_size: 128mb
  app:
    build: .
    image: grit-wms:${GRIT_IMAGE_TAG:-hostkey}
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      SECRET_KEY: ${SECRET_KEY:?Generate .env first}
      WMS_BADGE_SECRET: ${WMS_BADGE_SECRET:?Generate .env first}
      WMS_TERMINAL_SECRET: ${WMS_TERMINAL_SECRET:?Generate .env first}
      MANAGER_WEB_PASSWORD: ${MANAGER_WEB_PASSWORD:?Generate .env first}
      GRIT_DATABASE_NAME: ${GRIT_DATABASE_NAME:-grit}
      WMS_REQUIRE_POSTGRES: "1"
      WMS_MIGRATE_SQLITE_FROM_S3: "0"
      MOYSKLAD_TOKEN: ${MOYSKLAD_TOKEN:-}
      WB_API_TOKEN: ""
      ONIX_PRINT_AGENT_TOKEN: ""
      YC_S3_BUCKET: ""
      GIT_COMMIT: ${GIT_COMMIT:-hostkey-test}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRIT_PORT:-8000}:8000"
    networks: [database, web]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    image: grit-wms-backup:hostkey
    env_file:
      - path: .env.backup
        required: false
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: grit
      PGDATABASE: ${GRIT_DATABASE_NAME:-grit}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      PGCONNECT_TIMEOUT: "5"
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-0}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-grit-wms/hostkey-test}
      BACKUP_S3_SSE: ${BACKUP_S3_SSE-AES256}
      BACKUP_S3_KMS_KEY_ID: ${BACKUP_S3_KMS_KEY_ID:-}
      BACKUP_ALERT_REQUIRED: ${BACKUP_ALERT_REQUIRED:-0}
    entrypoint: [/bin/sh, /scripts/backup-loop.sh]
    volumes:
      - ${GRIT_DATA_ROOT:-/opt/grit-data}/backups:/backups
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks: [database, web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, sh, /scripts/backup-health.sh]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3
    logging: *logging
networks:
  database:
    internal: true
  web:
