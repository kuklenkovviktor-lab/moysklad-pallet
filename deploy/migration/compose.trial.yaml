# Standalone project: NEVER shares the HOSTKEY production data bind path.
name: grit-migration-trial
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: grit
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate separate trial env}
    volumes:
      - trial_postgres:/var/lib/postgresql/data
    networks: [trial]
    healthcheck:
      test: [CMD, pg_isready, -U, grit, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 20
  migration:
    profiles: [tools]
    image: grit-migration:test
    build:
      context: ../..
      dockerfile: deploy/migration/Dockerfile
    environment:
      GRIT_MIGRATION_DSN: postgresql://grit:${POSTGRES_PASSWORD}@db:5432/postgres
    volumes:
      - ${GRIT_MIGRATION_BUNDLES:?Set absolute directory with verified test bundles}:/bundles:ro
    networks: [trial]
    depends_on:
      db:
        condition: service_healthy
  app:
    profiles: [serve]
    image: grit-wms:migration-trial
    build: ../..
    entrypoint: [python, deploy/migration/trial_entrypoint.py]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate separate trial env}
      SECRET_KEY: ${SECRET_KEY:?Generate separate trial env}
      WMS_BADGE_SECRET: ${WMS_BADGE_SECRET:?Generate separate trial env}
      WMS_TERMINAL_SECRET: ${WMS_TERMINAL_SECRET:?Generate separate trial env}
      MANAGER_WEB_PASSWORD: ${MANAGER_WEB_PASSWORD:?Generate separate trial env}
      GRIT_TRIAL_DATABASE: restore_check_trial
    ports: ['127.0.0.1:18000:8000']
    healthcheck:
      test: [CMD, python, deploy/migration/trial_health.py]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    networks: [trial]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  trial:
    internal: true
volumes:
  trial_postgres:
