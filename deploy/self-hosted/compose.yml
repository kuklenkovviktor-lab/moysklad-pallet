# One owner-controlled VPS: ONIX web app, PostgreSQL 16, HTTPS Caddy.
# Start db and restore the verified Render dump BEFORE starting web.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onix
      POSTGRES_DB: onix
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onix -d onix"]
      interval: 10s
      timeout: 5s
      retries: 15
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WMS_REQUIRE_POSTGRES: "1"
      WMS_MIGRATE_SQLITE_FROM_S3: "0"
      PYTHONUNBUFFERED: "1"
      # Preserve these settings from Render before migrating.
      WB_STRICT_MATCHING: ${WB_STRICT_MATCHING:-0}
      SUPERVISOR_QR_PERIOD: ${SUPERVISOR_QR_PERIOD:-30}
    secrets:
      - postgres_password
      - flask_secret
      - badge_secret
      - terminal_secret
      - manager_password
      - moysklad_token
      - wb_api_token
    # Outbound access is needed for MoySklad/Wildberries APIs.
    # Database is reachable only on internal Docker network.
    networks: [internal, external]
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 4

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      ONIX_DOMAIN: ${ONIX_DOMAIN:?Set an owned domain in deploy/self-hosted/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, external]
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  flask_secret:
    file: ./secrets/flask_secret
  badge_secret:
    file: ./secrets/badge_secret
  terminal_secret:
    file: ./secrets/terminal_secret
  manager_password:
    file: ./secrets/manager_password
  moysklad_token:
    file: ./secrets/moysklad_token
  wb_api_token:
    file: ./secrets/wb_api_token

networks:
  internal:
    internal: true
  external: {}

volumes:
  pg_data:
  caddy_data:
  caddy_config:
